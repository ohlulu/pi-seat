# Tag-driven release: bare-semver tag push → gate → npm publish (OIDC trusted
# publishing, no token) → GitHub Release with the matching CHANGELOG section.
# Trusted publisher is configured on npmjs.com (package → Settings → Trusted
# Publisher: GitHub Actions, ohlulu/pi-seat, workflow release.yml).
name: Release

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: write # gh release create
  id-token: write # npm OIDC exchange

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck

      # OIDC trusted publishing needs npm >= 11.5.1; runner images lag.
      - run: npm install -g npm@latest
      - run: npm publish

      - name: Extract changelog section
        run: awk "/^## \[${GITHUB_REF_NAME}\]/{f=1;next} /^## \[/{f=0} f" CHANGELOG.md > /tmp/notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
